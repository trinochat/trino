name: Release

# Beta bundles for Windows, macOS (Apple Silicon + Intel) and Linux.
#
# Triggered by pushing a tag:   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1
# The GitHub release is created as a DRAFT prerelease, so nothing reaches users
# until you review the artifacts and publish it yourself.
#
# SIGNING: every signing input below is read from repository secrets. While they
# are unset the build still succeeds, but produces UNSIGNED bundles — macOS
# Gatekeeper and Windows SmartScreen will warn testers, and the Tauri updater
# will not work. See docs/release.md before inviting anyone outside the team.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Windows
            os: windows-latest
            target: ""
            args: ""
          - label: Linux
            os: ubuntu-22.04
            target: ""
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-${{ matrix.label }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Tauri updater signing. Generate once with `npm run tauri signer generate`
          # and store the PRIVATE key as a secret — never in the repo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # macOS code signing + notarisation (Apple Developer Program required).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Trino Chat ${{ github.ref_name }}
          releaseBody: |
            Beta build. The cryptographic core has **not** been externally audited —
            see `docs/security-roadmap.md` for what is protected today and what is not.

            Android and iOS are not included: the mobile client is not implemented yet.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
