# Static analysis for the app: the Flutter recommended lints plus a few that
# keep the code consistent. `flutter analyze` must report no issues.
include: package:flutter_lints/flutter.yaml

# `dart format` lays out the code; lines up to 120 columns.
formatter:
  page_width: 120

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - require_trailing_commas
    - always_declare_return_types
    - unawaited_futures
    - avoid_dynamic_calls
    - directives_ordering
