name: trino_mobile
description: "Trino for Android: end-to-end encrypted messages and calls."
# A private app: never published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: 3.47.5

# Exact versions on purpose: the lock file is committed and every upgrade is a
# reviewed change. No state-management, font or network packages.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The old demo shell's, until the new screens replace it.
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # Bundled, unmodified, under the SIL Open Font License (OFL.txt beside each).
  # The variable fonts take their weight from FontWeight (the wght axis).
  fonts:
    # Calma: reading text, headings and labels.
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/atkinson-hyperlegible-next/AtkinsonHyperlegibleNext-VariableFont_wght.ttf
    # Calma: keys, codes and times.
    - family: Atkinson Hyperlegible Mono
      fonts:
        - asset: assets/fonts/atkinson-hyperlegible-mono/AtkinsonHyperlegibleMono-VariableFont_wght.ttf
    # Terminal: reading text.
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/ibm-plex-sans/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm-plex-sans/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm-plex-sans/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm-plex-sans/IBMPlexSans-Bold.ttf
          weight: 700
    # Terminal: headings, labels, keys, codes and times.
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-VariableFont_wght.ttf
