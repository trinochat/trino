[package]
name = "trino-net"
version = "0.1.0"
description = "Trino Chat's network: every connection the app opens, through Tor unless a permit says otherwise"
authors = ["davidalmeidac"]
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# No Tauri and nothing of the app in here (Tor design §2.1): the engine that
# M4 extracts for Android and iPhone takes this crate as it is.

[features]
# The in-memory transports and HTTP servers for tests (src/mock.rs,
# src/mock_http.rs), and building a `Net` or an `HttpClient` on them. Only the
# app's dev-dependencies turn it on.
test-util = []

[dependencies]
futures-util = "0.3"
# HTTP/1.1 over whatever `Net` gives (src/http.rs, Tor design §2.1): hyper's
# low-level client, over a connection it is handed, never one it opens.
# hyper-util only for its tokio adapter; its connectors are disallowed in
# clippy.toml (R-21) and their features stay off.
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# TLS for wss:// and https://, with ring, the only provider in the tree, chosen here
# rather than left to whichever features the process happens to enable.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
# rustls over a connection, for https:// (the default features would bring
# aws-lc-rs).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The same version and features as the app's, so the WebSocket types are one.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Parses addresses and resolves a redirect's Location against them.
url = "2"
# The roots tokio-tungstenite checks against, as before Tor.
webpki-roots = "0.26"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# tests/arti_windows_smoke.rs: Arti's consensus parser and the crate whose
# Windows loop the workspace patches. TOR-5 brings them in as Arti's own.
saturating-time = "0.5"
tor-netdoc = { version = "0.47", default-features = false }
