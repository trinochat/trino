[package]
name = "trino-engine"
version = "0.1.0"
description = "Trino Chat's engine: the session's state and logic, apart from any UI"
authors = ["davidalmeidac"]
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# No Tauri and nothing of the desktop UI in here (M4-0): the desktop app
# drives it through its commands, and the Android and iPhone apps will
# through FFI. tests/no_tauri.rs keeps Tauri out of its dependency tree.

[features]
# What the app's tests take from the engine (`fsutil::scratch`, the test
# relay in `nostr::test_relay`, `testing`, the stores and disks of
# `store::*::testing`, `faulty` and `cut`), and no diagnostic log written
# from tests (diag.rs). Only the app's dev-dependencies turn it on, as
# trino-net's `test-util`.
test-util = ["trino-net/test-util"]

[dependencies]
# Protocol and cryptography, at the same commit as the app's (Cargo.lock).
trino-core = { git = "https://github.com/trinochat/trino-core", rev = "c6b3eda8ef26b9697bf79fd419f9115c98187c5d" }
# Every connection: the relays (nostr.rs) and Blossom (blossom.rs).
trino-net = { path = "../trino-net" }
serde = { version = "1", features = ["derive"] }
# The data folder, ~/.trino, unless TRINO_HOME or the mobile sandbox says
# otherwise (state.rs).
dirs = "5"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
# The relays (nostr.rs): Nostr events signed with Schnorr, over WebSockets.
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json = "1"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
# The store's keys (store/keys.rs): HKDF and HMAC over SHA-256.
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
# The one-time key each call's TURN request is signed with (turn.rs).
rand = "0.8"

[dev-dependencies]
# Tests derive vault keys at trino-core's test parameters, not 64 MiB of
# Argon2id each (its `test-kdf` feature). Only here, never in
# [dependencies]: a vault a test build writes never opens in a build that
# ships, and a release build with it does not compile (trino-core lib.rs).
trino-core = { git = "https://github.com/trinochat/trino-core", rev = "c6b3eda8ef26b9697bf79fd419f9115c98187c5d", features = ["test-kdf"] }
# Tor as an in-memory pipe, and a direct transport that fails the test.
trino-net = { path = "../trino-net", features = ["test-util"] }
# tokio's paused clock (`start_paused`) for the relay tests.
tokio = { version = "1", features = ["test-util"] }
