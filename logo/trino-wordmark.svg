<svg width="520" height="160" viewBox="0 0 520 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="s" width="6" height="4" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#22ff66" opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="6" y="6" width="508" height="148" rx="20" fill="#070a07"/>
  <rect x="6" y="6" width="508" height="148" rx="20" fill="url(#s)"/>
  <rect x="8" y="8" width="504" height="144" rx="18" fill="none" stroke="#0d4023" stroke-width="3"/>

  <!-- prompt chevron -->
  <g filter="url(#g)" stroke="#22ff66" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="44,58 72,88 44,118"/>
  </g>

  <!-- wordmark -->
  <text x="96" y="105" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,monospace"
        font-size="72" font-weight="700" letter-spacing="2" fill="#22ff66" filter="url(#g)">Trino</text>

  <!-- blinking cursor -->
  <rect x="366" y="60" width="30" height="48" fill="#22ff66" filter="url(#g)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- tagline -->
  <text x="98" y="134" font-family="'JetBrains Mono',monospace" font-size="15" letter-spacing="4"
        fill="#0d4023">E2E · NO SERVER · P2P</text>
</svg>
