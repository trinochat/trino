# Workspace root.
#
#   src-tauri          — the desktop client (Tauri 2)
#   crates/trino-net   — every connection the client opens: Tor, and the two
#                        permits to go without it (no Tauri in it, so the
#                        engine M4 extracts takes it as it is)
#
# The protocol and cryptography live in their own repository so they can be
# reviewed without this application around them:
#
#   https://github.com/trinochat/trino-core
#
# The Flutter mobile client in apps/mobile will bind to that same crate over FFI
# rather than reimplementing the protocol. See docs/mobile-client.md.

[workspace]
resolver = "2"
members = ["src-tauri", "crates/trino-net"]

# The TURN proof of work (src-tauri/src/turn.rs) hashes about a million times
# per request. Unoptimized that takes ~20 s instead of ~1 s, and the Worker
# only accepts events up to 60 s old, so dev and test builds optimize sha2's
# compression function (about 4x faster there; the generic wrappers around it
# are compiled with this crate and stay unoptimized).
[profile.dev.package.sha2]
opt-level = 3
