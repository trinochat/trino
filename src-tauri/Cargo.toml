[package]
name = "trino-gui"
version = "0.1.0"
description = "Trino Chat — end-to-end encrypted messenger"
authors = ["davidalmeidac"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "trino_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Protocol + crypto core, shared with the mobile client. Lives in its own
# repository so it can be audited on its own; Cargo.lock pins the exact commit,
# so builds stay reproducible. To work on both at once, add a [patch] pointing
# at a local checkout — do not commit it.
trino-core = { git = "https://github.com/trinochat/trino-core", rev = "3421e168c94da92d21234e1a8c1587d552b0002b" }

# Every connection the app opens: through Tor, or with one of the two
# permits to go without it (Tor design §2). No Tauri in it.
trino-net = { path = "../crates/trino-net" }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# crypto primitives
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }

# async + websocket
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# misc
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

# On Linux, Tauri uses WebKitGTK, which denies getUserMedia (mic/camera) unless
# the app handles the permission-request signal. Pinned to wry's version so the
# webview types unify (no second copy of the crate).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

# Reads Windows' text size from the registry in-process (src/a11y.rs), where
# spawning reg.exe fails under the policy that blocks the registry tools. The
# build already has this version through embed-resource, so no new crate.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55.0"
# Locking with Windows (src/system_events.rs): the session and power
# notifications, through a hidden window of our own; and copying without
# the clipboard history (src/clipboard.rs); Windows Error Reporting
# (src/traces.rs). tao, wry and webview2-com already build this version, so
# no new crate: only the features these calls need.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_ErrorReporting",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# Clearing WebView2's download history and finding its minidumps
# (src/traces.rs). Pinned to the version wry builds, so the webview types
# unify and no new crate comes in.
webview2-com = "=0.38.2"

[dev-dependencies]
proptest = "1"
# Tor as an in-memory pipe, and a direct transport that fails the test.
trino-net = { path = "../crates/trino-net", features = ["test-util"] }
